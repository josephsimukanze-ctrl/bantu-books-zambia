{% load static %}

<nav class="bg-white dark:bg-gray-900 shadow-lg sticky top-0 z-50 transition-all duration-300" id="mainNav">
    <div class="container mx-auto px-3 sm:px-4 lg:px-6">
        <div class="flex justify-between items-center h-14 sm:h-16">
            
            <!-- Mobile Menu Button (Left side for mobile) -->
            <div class="lg:hidden">
                <button id="mobileMenuToggle" class="p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-all duration-300">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
            
            <!-- Logo - Responsive text size -->
            <div class="flex items-center flex-1 lg:flex-none justify-center lg:justify-start">
                <a href="{% url 'core:home' %}" class="flex items-center space-x-1 sm:space-x-2 group">
                    <div class="relative">
                        <i class="fas fa-book-open text-xl sm:text-2xl text-green-600 dark:text-green-400 group-hover:scale-110 transition-transform duration-300"></i>
                        <div class="absolute -top-1 -right-2 w-1.5 h-1.5 sm:w-2 sm:h-2 bg-orange-500 rounded-full opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    </div>
                    <span class="text-base sm:text-lg md:text-xl font-bold bg-gradient-to-r from-gray-800 to-green-600 dark:from-white dark:to-green-400 bg-clip-text text-transparent whitespace-normal break-words max-w-[180px] sm:max-w-none">
                        Bantu Books<br class="hidden sm:inline"> Zambia
                    </span>
                </a>
            </div>
            
            <!-- Right Section - Search and User Menu -->
            <div class="flex items-center space-x-1 sm:space-x-2 md:space-x-4">
                <!-- Dark Mode Toggle Button -->
                <button id="darkModeToggle" class="p-1.5 sm:p-2 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all duration-300">
                    <i id="darkModeIcon" class="fas fa-moon text-sm sm:text-base"></i>
                </button>
                
                <!-- Search Form - Hidden on mobile, shows modal -->
                <div class="hidden md:block relative">
                    <form action="{% url 'books:search_books' %}" method="GET" class="relative" id="searchForm">
                        <input type="text" 
                               name="q" 
                               id="searchInput"
                               placeholder="Search books, authors..." 
                               class="search-input w-48 lg:w-64 xl:w-80 px-3 sm:px-4 py-1.5 sm:py-2 pl-8 sm:pl-10 pr-8 sm:pr-10 text-sm border border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-white rounded-lg focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 dark:focus:ring-green-800 transition-all duration-300"
                               autocomplete="off">
                        <i class="fas fa-search absolute left-2.5 sm:left-3 top-2 sm:top-2.5 text-gray-400 dark:text-gray-500 text-xs sm:text-sm"></i>
                        <button type="button" id="clearSearch" class="absolute right-2.5 sm:right-3 top-2 sm:top-2.5 text-gray-400 hover:text-red-500 dark:hover:text-red-400 hidden">
                            <i class="fas fa-times-circle text-xs sm:text-sm"></i>
                        </button>
                        <div id="searchResults" class="absolute top-full left-0 right-0 mt-2 bg-white dark:bg-gray-800 rounded-lg shadow-xl hidden z-50 max-h-80 overflow-y-auto border border-gray-100 dark:border-gray-700"></div>
                    </form>
                </div>
                
                <!-- Mobile Search Button -->
                <button id="mobileSearchBtn" class="md:hidden p-1.5 sm:p-2 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all duration-300">
                    <i class="fas fa-search text-sm sm:text-base"></i>
                </button>
                
                <!-- User Menu -->
                {% if user.is_authenticated %}
                    <div class="relative" id="userMenu">
                        <button class="flex items-center focus:outline-none group" id="userMenuBtn">
                            <div class="relative">
                                {% if user.profile_picture %}
                                    <img src="{{ user.profile_picture.url }}" class="w-7 h-7 sm:w-8 sm:h-8 lg:w-9 lg:h-9 rounded-full object-cover border-2 border-green-500 dark:border-green-400 group-hover:border-green-600 transition-all duration-300 group-hover:scale-105">
                                {% else %}
                                    <div class="w-7 h-7 sm:w-8 sm:h-8 lg:w-9 lg:h-9 bg-gradient-to-r from-green-500 to-green-600 rounded-full flex items-center justify-center text-white font-semibold text-xs sm:text-sm shadow-md group-hover:scale-105 transition-all duration-300">
                                        {{ user.username|first|upper }}
                                    </div>
                                {% endif %}
                                <div class="absolute bottom-0 right-0 w-2 h-2 sm:w-2.5 sm:h-2.5 bg-green-500 border-2 border-white dark:border-gray-900 rounded-full"></div>
                            </div>
                            <i class="fas fa-chevron-down text-gray-500 dark:text-gray-400 text-[10px] sm:text-xs ml-0.5 sm:ml-1 transition-transform duration-300 group-hover:rotate-180"></i>
                        </button>
                        
                        <!-- User Dropdown Menu - Responsive width -->
                        <div id="userDropdown" class="absolute right-0 mt-2 w-[280px] sm:w-80 bg-white dark:bg-gray-800 rounded-xl shadow-2xl hidden z-50 border border-gray-100 dark:border-gray-700 overflow-hidden transform transition-all duration-300 opacity-0 scale-95">
                            <!-- Rest of dropdown content remains the same -->
                            <!-- ... (keep existing dropdown content) ... -->
                        </div>
                    </div>
                {% else %}
                    <div class="flex items-center space-x-1 sm:space-x-2">
                        <a href="{% url 'accounts:login' %}" class="text-green-600 dark:text-green-400 hover:text-green-700 font-semibold text-xs sm:text-sm px-2 sm:px-3 py-1.5 sm:py-2 rounded-lg hover:bg-green-50 dark:hover:bg-green-900/20 transition-all duration-300 whitespace-nowrap">
                            <i class="fas fa-sign-in-alt mr-0.5 sm:mr-1 text-xs sm:text-sm"></i> <span class="hidden xs:inline">Login</span>
                        </a>
                        <a href="{% url 'accounts:register' %}" class="bg-gradient-to-r from-green-600 to-green-700 text-white px-2 sm:px-3 py-1.5 sm:py-2 rounded-lg hover:from-green-700 hover:to-green-800 transition-all duration-300 shadow-md hover:shadow-lg transform hover:scale-105 text-xs sm:text-sm whitespace-nowrap">
                            <i class="fas fa-user-plus mr-0.5 sm:mr-1 text-xs sm:text-sm"></i> <span class="hidden xs:inline">Register</span>
                        </a>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

<!-- Mobile Search Modal -->
<div id="mobileSearchModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-start justify-center pt-16 px-4">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-md">
        <div class="p-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold dark:text-white">Search Books</h3>
                <button id="closeMobileSearch" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form action="{% url 'books:search_books' %}" method="GET" class="relative">
                <input type="text" 
                       name="q" 
                       id="mobileSearchInput"
                       placeholder="Search by title, author..." 
                       class="w-full px-4 py-3 pl-10 pr-4 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:outline-none focus:border-green-500"
                       autocomplete="off">
                <i class="fas fa-search absolute left-3 top-3.5 text-gray-400"></i>
                <button type="submit" class="mt-3 w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
                    Search
                </button>
            </form>
        </div>
    </div>
</div>

<style>
    /* Responsive container */
    .container {
        width: 100%;
    }
    
    /* Hide on extra small screens */
    @media (max-width: 400px) {
        .xs\:inline {
            display: inline !important;
        }
    }
    
    @media (min-width: 401px) {
        .xs\:inline {
            display: inline !important;
        }
        .hidden.xs\:inline {
            display: none;
        }
    }
    
    /* Default hide for extra small text */
    .xs\:inline {
        display: none;
    }
    
    /* Responsive search input */
    .search-input {
        transition: all 0.3s ease;
    }
    
    .search-input:focus {
        width: 100%;
        min-width: 200px;
    }
    
    @media (min-width: 640px) {
        .search-input:focus {
            width: 240px;
        }
    }
    
    @media (min-width: 768px) {
        .search-input:focus {
            width: 280px;
        }
    }
    
    @media (min-width: 1024px) {
        .search-input:focus {
            width: 320px;
        }
    }
    
    /* Dropdown items - responsive */
    .dropdown-item {
        display: flex;
        align-items: center;
        padding: 0.5rem 0.75rem;
        color: #4b5563;
        transition: all 0.3s ease;
        gap: 0.5rem;
        text-decoration: none;
        font-size: 0.813rem;
    }
    
    @media (min-width: 640px) {
        .dropdown-item {
            padding: 0.6rem 1rem;
            gap: 0.75rem;
            font-size: 0.875rem;
        }
    }
    
    .dark .dropdown-item {
        color: #9ca3af;
    }
    
    .dropdown-item:hover {
        background-color: #f9fafb;
        color: #059669;
        padding-left: 1rem;
    }
    
    @media (min-width: 640px) {
        .dropdown-item:hover {
            padding-left: 1.25rem;
        }
    }
    
    .dark .dropdown-item:hover {
        background-color: #1f2937;
        color: #34d399;
    }
    
    /* Search results */
    .search-result-item {
        padding: 0.625rem 0.875rem;
        border-bottom: 1px solid #f3f4f6;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.813rem;
    }
    
    @media (min-width: 640px) {
        .search-result-item {
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
        }
    }
    
    .dark .search-result-item {
        border-bottom-color: #374151;
    }
    
    .search-result-item:hover {
        background-color: #f9fafb;
        padding-left: 1rem;
    }
    
    @media (min-width: 640px) {
        .search-result-item:hover {
            padding-left: 1.25rem;
        }
    }
    
    .dark .search-result-item:hover {
        background-color: #1f2937;
    }
    
    /* Dropdown animations */
    #userDropdown {
        transition: opacity 0.3s ease, transform 0.3s ease;
    }
    
    #userDropdown:not(.hidden) {
        opacity: 1 !important;
        transform: scale(100%) !important;
    }
    
    /* Custom scrollbar */
    .max-h-\[80vh\]::-webkit-scrollbar {
        width: 4px;
    }
    
    @media (min-width: 640px) {
        .max-h-\[80vh\]::-webkit-scrollbar {
            width: 6px;
        }
    }
    
    .max-h-\[80vh\]::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 3px;
    }
    
    .dark .max-h-\[80vh\]::-webkit-scrollbar-track {
        background: #374151;
    }
    
    .max-h-\[80vh\]::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 3px;
    }
    
    .dark .max-h-\[80vh\]::-webkit-scrollbar-thumb {
        background: #6b7280;
    }
    
    .max-h-\[80vh\]::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8;
    }
    
    .dark .max-h-\[80vh\]::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
    }
    
    /* Prevent text wrapping on logo */
    .whitespace-normal {
        white-space: normal;
        line-height: 1.2;
    }
    
    /* Mobile menu animation */
    #mobileSidebar {
        transition: transform 0.3s ease-in-out;
    }
    
    #mobileSidebar.translate-x-0 {
        transform: translateX(0);
    }
</style>

<script>
    // Dark Mode Toggle
    const darkModeToggle = document.getElementById('darkModeToggle');
    const darkModeIcon = document.getElementById('darkModeIcon');
    
    // Check for saved dark mode preference
    if (localStorage.getItem('darkMode') === 'true' || 
        (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        darkModeIcon.classList.remove('fa-moon');
        darkModeIcon.classList.add('fa-sun');
    }
    
    darkModeToggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        localStorage.setItem('darkMode', isDark);
        
        if (isDark) {
            darkModeIcon.classList.remove('fa-moon');
            darkModeIcon.classList.add('fa-sun');
        } else {
            darkModeIcon.classList.remove('fa-sun');
            darkModeIcon.classList.add('fa-moon');
        }
    });
    
    // Mobile Menu Toggle
    const mobileMenuToggle = document.getElementById('mobileMenuToggle');
    const mobileSidebar = document.getElementById('mobileSidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    
    if (mobileMenuToggle) {
        mobileMenuToggle.addEventListener('click', () => {
            if (mobileSidebar) {
                mobileSidebar.classList.toggle('hidden');
                mobileSidebar.classList.toggle('translate-x-0');
                mobileSidebar.classList.toggle('-translate-x-full');
            }
            if (sidebarOverlay) {
                sidebarOverlay.classList.toggle('hidden');
            }
        });
    }
    
    // Mobile Search Modal
    const mobileSearchBtn = document.getElementById('mobileSearchBtn');
    const mobileSearchModal = document.getElementById('mobileSearchModal');
    const closeMobileSearch = document.getElementById('closeMobileSearch');
    
    if (mobileSearchBtn && mobileSearchModal) {
        mobileSearchBtn.addEventListener('click', () => {
            mobileSearchModal.classList.remove('hidden');
            mobileSearchModal.classList.add('flex');
            document.getElementById('mobileSearchInput')?.focus();
        });
        
        if (closeMobileSearch) {
            closeMobileSearch.addEventListener('click', () => {
                mobileSearchModal.classList.add('hidden');
                mobileSearchModal.classList.remove('flex');
            });
        }
        
        mobileSearchModal.addEventListener('click', (e) => {
            if (e.target === mobileSearchModal) {
                mobileSearchModal.classList.add('hidden');
                mobileSearchModal.classList.remove('flex');
            }
        });
    }
    
    // User Menu Dropdown
    const userMenuBtn = document.getElementById('userMenuBtn');
    const userDropdown = document.getElementById('userDropdown');
    
    if (userMenuBtn && userDropdown) {
        userMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            userDropdown.classList.toggle('hidden');
            if (!userDropdown.classList.contains('hidden')) {
                userDropdown.style.opacity = '1';
                userDropdown.style.transform = 'scale(100%)';
            } else {
                userDropdown.style.opacity = '0';
                userDropdown.style.transform = 'scale(95%)';
            }
        });
        
        document.addEventListener('click', (e) => {
            if (userDropdown && !userDropdown.classList.contains('hidden')) {
                if (!userMenuBtn.contains(e.target) && !userDropdown.contains(e.target)) {
                    userDropdown.classList.add('hidden');
                    userDropdown.style.opacity = '0';
                    userDropdown.style.transform = 'scale(95%)';
                }
            }
        });
    }
    
    // Desktop Live Search
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const clearSearchBtn = document.getElementById('clearSearch');
    let searchTimeout;
    
    if (searchInput) {
        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            clearTimeout(searchTimeout);
            
            if (query.length > 2) {
                clearSearchBtn.classList.remove('hidden');
                searchTimeout = setTimeout(() => {
                    searchResults.innerHTML = '<div class="p-4 text-center text-gray-500 dark:text-gray-400"><i class="fas fa-spinner fa-spin mr-2"></i> Searching...</div>';
                    searchResults.classList.remove('hidden');
                    
                    fetch(`/books/search/?q=${encodeURIComponent(query)}&format=json`)
                        .then(response => response.json())
                        .then(data => {
                            if (data.books && data.books.length > 0) {
                                let html = '';
                                data.books.forEach(book => {
                                    html += `<div class="search-result-item" onclick="window.location.href='/books/${book.slug}/'">
                                                <div class="font-medium text-gray-800 dark:text-white text-sm sm:text-base">${escapeHtml(book.title)}</div>
                                                <div class="text-xs text-gray-500 dark:text-gray-400">${escapeHtml(book.author)}</div>
                                            </div>`;
                                });
                                html += `<div class="p-2 text-center border-t dark:border-gray-700">
                                            <a href="/books/search/?q=${encodeURIComponent(query)}" class="text-xs sm:text-sm text-green-600 dark:text-green-400 hover:text-green-700">View all results →</a>
                                        </div>`;
                                searchResults.innerHTML = html;
                            } else {
                                searchResults.innerHTML = `<div class="p-4 text-center text-gray-500 dark:text-gray-400 text-sm">
                                            <i class="fas fa-search mr-2"></i> No books found for "${escapeHtml(query)}"
                                        </div>
                                        <div class="p-2 text-center border-t dark:border-gray-700">
                                            <a href="/books/request-book/" class="text-xs sm:text-sm text-green-600 dark:text-green-400 hover:text-green-700">Request this book →</a>
                                        </div>`;
                            }
                        })
                        .catch(error => {
                            searchResults.innerHTML = '<div class="p-4 text-center text-red-500 dark:text-red-400 text-sm">Error loading results</div>';
                        });
                }, 300);
            } else {
                clearSearchBtn.classList.add('hidden');
                searchResults.classList.add('hidden');
            }
        });
        
        if (clearSearchBtn) {
            clearSearchBtn.addEventListener('click', function() {
                searchInput.value = '';
                searchInput.focus();
                clearSearchBtn.classList.add('hidden');
                searchResults.classList.add('hidden');
            });
        }
        
        document.addEventListener('click', function(e) {
            if (searchInput && searchResults && !searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.add('hidden');
            }
        });
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            if (userDropdown && !userDropdown.classList.contains('hidden')) {
                userDropdown.classList.add('hidden');
                userDropdown.style.opacity = '0';
                userDropdown.style.transform = 'scale(95%)';
            }
            if (searchResults && !searchResults.classList.contains('hidden')) {
                searchResults.classList.add('hidden');
            }
            if (mobileSearchModal && !mobileSearchModal.classList.contains('hidden')) {
                mobileSearchModal.classList.add('hidden');
                mobileSearchModal.classList.remove('flex');
            }
        }
    });
    
    let lastScroll = 0;
    const navbar = document.getElementById('mainNav');
    window.addEventListener('scroll', () => {
        const currentScroll = window.pageYOffset;
        if (currentScroll > 50) {
            navbar.classList.add('shadow-xl');
        } else {
            navbar.classList.remove('shadow-xl');
        }
        lastScroll = currentScroll;
    });
</script>
