{% for book in books %}
<div class="col-span-1">
    <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition group">
        <a href="{% url 'books:book_detail' book.slug %}">
            <div class="relative h-40 overflow-hidden">
                {% if book.cover_image %}
                    <img src="{{ book.cover_image.url }}" alt="{{ book.title }}" class="w-full h-full object-cover group-hover:scale-105 transition">
                {% else %}
                    <div class="w-full h-full bg-gradient-to-br from-green-100 to-green-200 flex items-center justify-center">
                        <i class="fas fa-book text-4xl text-green-600"></i>
                    </div>
                {% endif %}
                {% if book.is_free %}
                <div class="absolute top-2 right-2 bg-green-500 text-white px-2 py-1 rounded text-xs font-bold">FREE</div>
                {% endif %}
            </div>
            <div class="p-3">
                <h3 class="font-bold text-md mb-1 line-clamp-1">{{ book.title }}</h3>
                <p class="text-gray-600 text-xs mb-2">{{ book.author }}</p>
                <div class="flex justify-between items-center">
                    <span class="text-green-600 font-semibold text-sm">{{ book.formatted_price }}</span>
                    <span class="text-green-600 text-xs font-semibold">View →</span>
                </div>
            </div>
        </a>
    </div>
</div>
{% empty %}
<div class="col-span-full text-center py-12">
    <i class="fas fa-search text-6xl text-gray-400 mb-4"></i>
    <p class="text-gray-600">No results found for "{{ query }}"</p>
</div>
{% endfor %}

{% if books.has_next %}
<div class="col-span-full text-center mt-4">
    <button hx-get="{% url 'books:search_books' %}?q={{ query }}&page={{ books.next_page_number }}"
            hx-trigger="click"
            hx-target="#search-results-container"
            hx-swap="innerHTML"
            class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition">
        Load More
    </button>
</div>
{% endif %}
